<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Choose Track</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}">
</head>
<body>
  <div class="container animate">
    <h1>Choose your track</h1>
    <p>Please choose whether you want Tech or Non-Tech focused questions.</p>

    <form method="POST">
      <label>
        <input type="radio" name="track" value="tech" required> Tech
      </label>
      <label>
        <input type="radio" name="track" value="nontech" required> Non-Tech
      </label>
      <br><br>
      <button type="submit" class="btn">Start Quiz</button>
    </form>
  </div>
</body>
</html>
